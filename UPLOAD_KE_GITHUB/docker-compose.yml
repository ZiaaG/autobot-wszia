version: '3.8'

services:
  autobot:
    build: .
    container_name: autobot-wszia-production
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=autobot_wszia_super_secret_production_key_2026
      - META_VERIFY_TOKEN=autobot_wszia_verify_secret_token_2026
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
